<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Belajar Korea SKOP</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4CAF50">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
margin:0;
}

h1{
text-align:center;
}

.menu{
display:flex;
gap:10px;
margin-bottom:20px;
}

.menu button{

flex:1;

padding:14px;

border:none;

border-radius:12px;

font-size:16px;

}

.box{

background:white;

padding:15px;

border-radius:15px;

margin-bottom:15px;

}

.hidden{

display:none;

}

#susun{

min-height:50px;

border:2px dashed #ccc;

padding:10px;

font-size:25px;

}

button{

padding:10px;

margin:5px;

border:none;

border-radius:10px;

}

</style>

</head>

<body>

<h1>🇰🇷 Belajar Korea SKOP</h1>


<div class="menu">

<button onclick="showTranslate()">

🎤 Translate

</button>

<button onclick="showBelajar()">

📚 Belajar

</button>

</div>



<!-- TRANSLATE -->

<div id="translate">


<div class="box">

<button onclick="mulaiBicara()">

🎤 Bicara

</button>

</div>



<div class="box">

<h3>Indonesia</h3>

<p id="indo">-</p>

</div>


<div class="box">

<h3>Bahasa Korea</h3>

<p id="korea">-</p>

</div>


</div>




<!-- BELAJAR -->

<div id="belajar" class="hidden">


<div class="box">

<h3>Kalimat yang akan jadi</h3>

<div id="susun">

____________

</div>

</div>



<div class="box">

<h3>Kosakata</h3>

<button onclick="pilih('저는')">

저는

</button>

<button onclick="pilih('먹다')">

먹다

</button>

<button onclick="pilih('마시다')">

마시다

</button>

</div>



<div class="box">

<h3>Akhiran</h3>

<button onclick="pilih('고 싶어요')">

고 싶어요

</button>

<button onclick="pilih('습니다')">

습니다

</button>

</div>



<div class="box">

<h3>Rumus</h3>

<p>

Subjek + Kata Kerja + Akhiran

</p>

</div>


</div>



<script>

function showTranslate(){

document.getElementById("translate")

.classList.remove("hidden");

document.getElementById("belajar")

.classList.add("hidden");

}



function showBelajar(){

document.getElementById("belajar")

.classList.remove("hidden");

document.getElementById("translate")

.classList.add("hidden");

}




let hasil=[];

function pilih(kata){

hasil.push(kata);

document.getElementById("susun")

.innerText=hasil.join(" ");

}





async function translateKorea(teks){

try{

const response=await fetch(

"https://translate.googleapis.com/translate_a/single?client=gtx&sl=id&tl=ko&dt=t&q="

+encodeURIComponent(teks)

);

const data=await response.json();

document.getElementById("korea")

.innerText=data[0][0][0];

}

catch{

document.getElementById("korea")

.innerText="Gagal menerjemahkan";

}

}





function mulaiBicara(){


const SpeechRecognition=

window.SpeechRecognition||

window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("Browser tidak mendukung");

return;

}



const recognition=

new SpeechRecognition();



recognition.lang="id-ID";

recognition.start();



recognition.onresult=function(event){


const teks=

event.results[0][0].transcript;



document.getElementById("indo")

.innerText=teks;



translateKorea(teks);


}



recognition.onerror=function(event){

alert(event.error);

}



}




if('serviceWorker' in navigator){

navigator.serviceWorker

.register('./service-worker.js');

}

</script>

</body>

</html>
