<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Belajar Korea SKOP</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<style>

body{
font-family:Arial,sans-serif;
margin:0;
padding:20px;
background:#f5f5f5;
}

h1{
text-align:center;
}

.menu{
display:flex;
gap:10px;
margin-bottom:20px;
}

.menu button{
flex:1;
padding:12px;
font-size:16px;
border:none;
border-radius:12px;
background:#4CAF50;
color:white;
}

.box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.hidden{
display:none;
}

#susun{
min-height:50px;
border:2px dashed #ccc;
padding:10px;
font-size:24px;
}

.pilih{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:#eee;
font-size:18px;
}

</style>

</head>

<body>

<h1>🇰🇷 Belajar Korea SKOP</h1>

<div class="menu">

<button onclick="showTranslate()">
🎤 Translate
</button>

<button onclick="showBelajar()">
📚 Belajar
</button>

</div>


<!-- MODE TRANSLATE -->

<div id="translate">

<h2>🎤 Mode Translate</h2>

<button onclick="mulaiBicara()">
🎤 Bicara
</button>

<div class="box">

<h3>Indonesia</h3>

<p id="indo">-</p>

</div>

<div class="box">

<h3>Bahasa Korea</h3>

<p id="korea">-</p>

</div>

<div class="box">

<h3>Ejaan</h3>

<p id="ejaan">-</p>

</div>


<!-- MODE BELAJAR -->

<div id="belajar" class="hidden">

<div class="box">

<h3>Kalimat yang akan jadi</h3>

<div id="susun">

____________

</div>

</div>


<div class="box">

<h3>Kosakata</h3>

<button class="pilih" onclick="pilih(this,'저')">
저
</button>

<button class="pilih" onclick="pilih(this,'먹다')">
먹다
</button>

</div>


<div class="box">

<h3>Partikel</h3>

<button class="pilih" onclick="pilih(this,'는')">
는
</button>

</div>


<div class="box">

<h3>Akhiran</h3>

<button class="pilih" onclick="pilih(this,'고 싶어요')">
고 싶어요
</button>

</div>


<div class="box">

<h3>Database</h3>

<p>

Indonesia :
Saya mau makan

</p>

<p>

Rumus :

Subjek + 는 + Kata Kerja + 고 싶어요

</p>

</div>

</div>


<script>

function showTranslate(){

document.getElementById("translate").classList.remove("hidden");

document.getElementById("belajar").classList.add("hidden");

}


function showBelajar(){

document.getElementById("belajar").classList.remove("hidden");

document.getElementById("translate").classList.add("hidden");

}



let hasil=[];

function pilih(btn,kata){

hasil.push(kata);

document.getElementById("susun").innerText=
hasil.join(" ");

btn.disabled=true;

}



function mulaiBicara(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;
if(!SpeechRecognition){
alert("Browser tidak mendukung Speech Recognition");
return;
}
const recognition = new SpeechRecognition();

recognition.lang = "id-ID";

recognition.start();
  

recognition.onresult = function(event){

const teks = event.results[0][0].transcript;

document.getElementById("indo").innerText = teks;

if(teks.toLowerCase() == "saya mau makan"){

document.getElementById("korea").innerText =
"저는 먹고 싶어요";

document.getElementById("ejaan").innerText =
"Jeoneun meokgo sipeoyo";

}else{

document.getElementById("korea").innerText =
"Belum ada di database";

document.getElementById("ejaan").innerText =
"-";

}
  
}
  
recognition.onerror = function(event){

alert(event.error);


}

}



if('serviceWorker' in navigator){

navigator.serviceWorker.register('./service-worker.js')

.then(()=>console.log("SW berhasil"))

.catch(err=>console.log(err));

}

</script>

</body>
</html>
